name: Deploy to staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy via rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          REMOTE_PATH: "/home/takagi3788/tesvr.lovepetstyle.com/public_html/wp-content/themes/base"
        run: |
          set -e
          echo "Deploying to $SSH_USER@$SSH_HOST:$REMOTE_PATH"
          rsync -avz -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=no" ./ $SSH_USER@$SSH_HOST:$REMOTE_PATH